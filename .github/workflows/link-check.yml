name: Link Check

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 60
            --exclude '^https://www\.science\.org/doi/10\.1126/science\.(1259433|aay2400)$'
            --exclude '^https://forumserver\.twoplustwo\.com/?$'
            --exclude '^https://ojs\.aaai\.org/(aimagazine/index\.php/aimagazine/article/view/2474/0|index\.php/AAAI/article/view/20394)$'
            --exclude '^https://www\.gtoplus\.com/?$'
            --exclude '^https://monkerware\.com/solver\.html$'
            "./**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
